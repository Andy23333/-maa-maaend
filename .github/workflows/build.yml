name: Build Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          pip install pyinstaller

      - name: Build EXE
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name MaaAutoBoot --icon assets/icon.ico
          --add-data "docs;docs"
          entry.py

      - name: Smoke check
        shell: pwsh
        timeout-minutes: 2
        run: |
          if (!(Test-Path 'dist/MaaAutoBoot.exe')) { Write-Error 'EXE not built'; exit 1 }
          Write-Host "EXE OK: $((Get-Item 'dist/MaaAutoBoot.exe').Length) bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaaAutoBoot-windows
          path: dist/MaaAutoBoot.exe

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MaaAutoBoot.exe
          generate_release_notes: true
